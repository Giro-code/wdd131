<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | Elio Diaz The Forruner</title>
  <meta name="description" content="Explore a responsive temple album with filters, dedication dates, locations, and floor areas.">
  <meta name="author" content="Elio Diaz The Forruner">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="styles/filtered-temples.css">
  <link rel="stylesheet" href="styles/filtered-temples-large.css">
  <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>
  <!-- OpenAI Codex assisted with implementation and verification. -->
  <header>
    <div class="header-inner">
      <span class="site-title">Temple Album</span>
      <button id="menu-button" type="button" aria-label="Open navigation menu" aria-controls="primary-navigation" aria-expanded="false"><span aria-hidden="true">☰</span></button>
      <nav id="primary-navigation" aria-label="Album navigation">
        <a href="#album" data-view="home" aria-current="page">Home</a>
        <a href="#album" data-view="old">Old</a>
        <a href="#album" data-view="new">New</a>
        <a href="#album" data-view="large">Large</a>
        <a href="#album" data-view="small">Small</a>
      </nav>
    </div>
  </header>
  <main id="album">
    <h1 id="view-title" tabindex="-1">Home</h1>
    <p id="view-description">Explore ten temples around the world.</p>
    <div class="gallery" id="temple-gallery"></div>
    <p class="album-note" id="view-note" aria-live="polite"></p>
  </main>
  <footer>
    <p>© <span id="currentyear"></span> · Elio Diaz The Forruner · Dominican Republic</p>
    <p id="lastModified"></p>
    <p class="photo-credit">Photographs: <a href="https://www.churchofjesuschrist.org/temples/photo-gallery?lang=eng">The Church of Jesus Christ of Latter-day Saints</a></p>
  </footer>
</body>
</html>
